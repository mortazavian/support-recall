[project]
name = "supportrecall-backend"
version = "0.1.0"
description = "Local API for the SupportRecall application"
requires-python = ">=3.14,<3.15"
dependencies = [
    "chromadb>=1.0,<2.0",
    "fastapi>=0.129,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0,<3.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
